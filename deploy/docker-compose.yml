# Production stack for the Oracle Cloud VM: the bot in webhook mode behind Caddy (automatic HTTPS).
# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  bot:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      BOT_MODE: webhook
      WEBHOOK_URL: https://${DOMAIN:?set DOMAIN in .env}
      PORT: 8080
    volumes:
      - bot-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [bot]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  bot-data:
  caddy-data:
  caddy-config:
