<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B2EFF"/>
      <stop offset="0.55" stop-color="#9B3DF2"/>
      <stop offset="1" stop-color="#FF5C7A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECE8FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="14" result="b"/>
      <feFlood flood-color="#1B0B4D" flood-opacity="0.45"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="6" result="b"/>
      <feFlood flood-color="#1B0B4D" flood-opacity="0.35"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="320" cy="300" r="300" fill="url(#glow)"/>

  <!-- Blokus-style pieces orbiting the die (kept inside the circular crop) -->
  <g filter="url(#soft)" stroke="#1B1640" stroke-opacity="0.18" stroke-width="3">
    <!-- yellow L, top left -->
    <g transform="translate(118 138) rotate(-18)">
      <rect x="0" y="0" width="44" height="44" rx="8" fill="#FFD23F"/>
      <rect x="0" y="46" width="44" height="44" rx="8" fill="#FFD23F"/>
      <rect x="0" y="92" width="44" height="44" rx="8" fill="#FFD23F"/>
      <rect x="46" y="92" width="44" height="44" rx="8" fill="#FFD23F"/>
    </g>
    <!-- green T, bottom right -->
    <g transform="translate(400 438) rotate(14)">
      <rect x="0" y="0" width="44" height="44" rx="8" fill="#2ED47A"/>
      <rect x="46" y="0" width="44" height="44" rx="8" fill="#2ED47A"/>
      <rect x="92" y="0" width="44" height="44" rx="8" fill="#2ED47A"/>
      <rect x="46" y="46" width="44" height="44" rx="8" fill="#2ED47A"/>
    </g>
    <!-- blue S, top right -->
    <g transform="translate(430 110) rotate(22)">
      <rect x="46" y="0" width="40" height="40" rx="8" fill="#3FA9FF"/>
      <rect x="88" y="0" width="40" height="40" rx="8" fill="#3FA9FF"/>
      <rect x="4" y="42" width="40" height="40" rx="8" fill="#3FA9FF"/>
      <rect x="46" y="42" width="40" height="40" rx="8" fill="#3FA9FF"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path d="M150 430 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z" opacity="0.9"/>
    <path d="M498 300 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" opacity="0.8"/>
    <circle cx="250" cy="520" r="6" opacity="0.7"/>
  </g>

  <!-- the die -->
  <g transform="translate(320 318) rotate(-12)" filter="url(#shadow)">
    <rect x="-128" y="-128" width="256" height="256" rx="52" fill="url(#face)"/>
    <rect x="-128" y="-128" width="256" height="256" rx="52" fill="none" stroke="#1B1640" stroke-opacity="0.08" stroke-width="4"/>
    <!-- five pips in the four game colors plus coral -->
    <circle cx="-64" cy="-64" r="25" fill="#3FA9FF"/>
    <circle cx="64" cy="-64" r="25" fill="#FFD23F"/>
    <circle cx="0" cy="0" r="27" fill="#FF5C7A"/>
    <circle cx="-64" cy="64" r="25" fill="#2ED47A"/>
    <circle cx="64" cy="64" r="25" fill="#7B4DFF"/>
  </g>
</svg>
